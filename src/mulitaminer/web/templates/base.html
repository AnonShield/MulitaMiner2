<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}MulitaMiner{% endblock %}</title>
<meta name="description" content="MulitaMiner turns vulnerability scanner PDF reports into structured findings with LLMs. Public demo.">
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="/"><img src="/static/logo.svg" alt=""><span class="word">Mulita<b>Miner</b></span></a>
    <nav>
      {% block nav %}
      <a href="/#how">How it works</a>
      <a href="/#research">Research</a>
      <a class="cta" href="/app">Launch app</a>
      {% endblock %}
    </nav>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>
  <div class="wrap">
    <span>MulitaMiner · MIT license · UNIPAMPA</span>
    <nav>
      <a href="https://github.com/INARI18/MulitaMiner2" target="_blank" rel="noopener">GitHub</a>
      <a href="https://huggingface.co/Inari18/mulita-extractor-qwen2.5-1.5b" target="_blank" rel="noopener">Model on Hugging Face</a>
      <a href="https://anonshield.org" target="_blank" rel="noopener">AnonShield</a>
      <span>Uploads are deleted after {{ retention_h }} h</span>
    </nav>
  </div>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
