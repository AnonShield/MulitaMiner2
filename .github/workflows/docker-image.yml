# Publishes the Docker images to Docker Hub, so nobody
# has to clone the repo to run the tool:
#   bia18/mulitaminer:web     the browser front end (docs/WEB.md)
#   bia18/mulitaminer:latest  the CLI (docs/DOCKER.md)
# A release adds :X.Y.Z-web and :X.Y.Z.
#
# Secrets (repository settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME  the Docker Hub user that owns the namespace
#   DOCKERHUB_TOKEN     an access token of that user (Read & Write), not the password
name: Docker image

on:
  push:
    branches: [main]
    paths: [Dockerfile, pyproject.toml, uv.lock, "src/**", .github/workflows/docker-image.yml]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: bia18/mulitaminer

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: web
            install_web: "true"
            suffix: web
            latest: "false"
          - name: cli
            install_web: "false"
            suffix: ""
            latest: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=${{ matrix.latest }}
            suffix=${{ matrix.suffix && format('-{0}', matrix.suffix) || '' }},onlatest=false
          tags: |
            type=raw,value=${{ matrix.suffix }},enable=${{ matrix.suffix != '' }},suffix=
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: INSTALL_WEB=${{ matrix.install_web }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
