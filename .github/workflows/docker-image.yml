# Publishes the Docker images to the GitHub Container Registry, so nobody has
# to clone the repo to run the tool:
#   ghcr.io/inari18/mulitaminer2:web     the browser front end (docs/WEB.md)
#   ghcr.io/inari18/mulitaminer2:latest  the CLI (docs/DOCKER.md)
# A release adds :X.Y.Z-web and :X.Y.Z. No account or secret beyond the
# repository's own GITHUB_TOKEN; the packages appear under the repo's
# "Packages" and are public once made so in their settings (one click, once).
name: Docker image

on:
  push:
    branches: [main]
    paths: [Dockerfile, pyproject.toml, uv.lock, "src/**", .github/workflows/docker-image.yml]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: web
            install_web: "true"
            suffix: web
            latest: "false"
          - name: cli
            install_web: "false"
            suffix: ""
            latest: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=${{ matrix.latest }}
            suffix=${{ matrix.suffix && format('-{0}', matrix.suffix) || '' }},onlatest=false
          tags: |
            type=raw,value=${{ matrix.suffix }},enable=${{ matrix.suffix != '' }},suffix=
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: INSTALL_WEB=${{ matrix.install_web }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
